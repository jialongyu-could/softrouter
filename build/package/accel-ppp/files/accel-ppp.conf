# accel-ppp 默认配置（首次启动前会被 SoftRouter 面板覆盖）
[modules]
pppoe
chap-secrets
ippool
pppd-compat

[core]
log-error=/var/log/accel-ppp/core.log
log-info=/var/log/accel-ppp/info.log
thread-count=2

[pppoe]
interface=br-lan
ac-name=SoftRouter
service-name=sparrow
called-sid=mac

[ppp]
mtu=1492
mru=1492
lcp-echo-interval=20
lcp-echo-failure=3
ipv4=require
ipv6=allow

[ipv4]
netmask=255.255.255.0
gw=192.168.200.1
pool=192.168.200.100-192.168.200.200
dns=223.5.5.5,119.29.29.29

[chap-secrets]
file=/etc/accel-ppp/chap-secrets

[pppd-compat]
ip-up-script=/etc/accel-ppp/ip-up.sh
ip-down-script=/etc/accel-ppp/ip-down.sh
