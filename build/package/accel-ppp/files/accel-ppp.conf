# accel-ppp 默认配置（首次启动前会被 LongOS 面板覆盖）
# 语法依据 accel-ppp 官方文档，段名使用连字符，模块名使用下划线
[modules]
pppoe
auth_pap
auth_chap_md5
auth_mschap_v1
auth_mschap_v2
chap-secrets
ippool
sigchld
pppd_compat
ipv6pool
ipv6_dhcp
ipv6_nd

[core]
log-error=/var/log/accel-ppp/core.log
log-info=/var/log/accel-ppp/info.log
thread-count=2

[cli]
tcp=127.0.0.1:2001

[pppoe]
interface=br-lan
ac-name=LongOS
service-name=sparrow
called-sid=mac
ipv6-pool=srv6
ipv6-pool-delegate=srv6pd
verbose=1

[ppp]
verbose=1
min-mtu=1280
mtu=1492
mru=1492
lcp-echo-interval=20
lcp-echo-failure=3
ipv4=require
ipv6=allow
ipv6-intf-id=random
ipv6-peer-intf-id=random

[ip-pool]
gw-ip-address=192.168.200.1
192.168.200.100-192.168.200.200

[dns]
dns1=223.5.5.5
dns2=119.29.29.29

[chap-secrets]
chap-secrets=/etc/accel-ppp/chap-secrets

[pppd-compat]
verbose=1
ip-up=/etc/accel-ppp/ip-up.sh
ip-down=/etc/accel-ppp/ip-down.sh

[ipv6-nd]
verbose=0
AdvManagedFlag=0
AdvOtherConfigFlag=1
AdvOnLinkFlag=1
AdvAutonomousFlag=1

[ipv6-pool]
fd00:1::/48,64,name=srv6
delegate=2408:8207:1234::/56,64,name=srv6pd

[ipv6-dhcp]
verbose=1
route-via-gw=1
