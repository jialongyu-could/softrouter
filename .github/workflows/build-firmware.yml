name: Build LongOS Firmware

# 触发方式：
#   1) 手动：Actions -> Build LongOS Firmware -> Run workflow
#   2) 打 tag：git tag v1.0.0 && git push origin v1.0.0  （会自动创建 Release）
#   3) 推送 main 分支
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt 版本（tag）'
        required: true
        default: 'v24.10.4'
      jobs:
        description: '并行编译度'
        required: true
        default: '4'
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      OPENWRT_VERSION: ${{ inputs.openwrt_version || 'v24.10.4' }}
      JOBS: ${{ inputs.jobs || '4' }}

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          echo "==> 清理构建机无用组件"
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo apt-get clean
          df -h /

      - name: 安装构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc-multilib g++-multilib \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev \
            bison flex gawk gettext unzip file wget rsync \
            python3 python3-setuptools python3-pip \
            git make cmake pkg-config \
            xorriso isolinux syslinux-common
          python3 --version

      - name: 修复 GNU coreutils（Ubuntu 26.04+ 默认 uutils）
        run: |
          # Ubuntu 26.04 起默认 coreutils 为 uutils (Rust 实现)，
          # OpenWrt prereq 检查 install --version 输出需含 "GNU"。
          # GNU 版由 gnu-coreutils 包提供，命令名带 gnu 前缀（无连字符，如 gnuinstall）。
          echo "==> 安装 gnu-coreutils"
          sudo apt-get install -y --no-install-recommends gnu-coreutils || true
          echo "==> 当前 install 版本"
          install --version | head -1
          # 仅链接 gnu-coreutils 包自身提供的命令，避免误链其他包的 gnu* 文件
          if command -v dpkg >/dev/null 2>&1; then
            echo "==> 从 gnu-coreutils 包提取命令并链接到 /usr/local/bin"
            for gnu_cmd in $(dpkg -L gnu-coreutils 2>/dev/null | grep -E '^/usr/(bin|sbin)/gnu'); do
              [ -x "$gnu_cmd" ] || continue
              cmd="${gnu_cmd##*/}"
              cmd="${cmd#gnu}"
              [ -n "$cmd" ] || continue
              sudo ln -sf "$gnu_cmd" "/usr/local/bin/$cmd"
            done
          else
            echo "==> dpkg 不可用，回退到 glob 方式"
            for gnu_cmd in /usr/bin/gnu*; do
              [ -e "$gnu_cmd" ] || continue
              cmd="${gnu_cmd#/usr/bin/gnu}"
              [ -n "$cmd" ] || continue
              sudo ln -sf "$gnu_cmd" "/usr/local/bin/$cmd"
            done
          fi
          echo "==> 验证 GNU install"
          install --version | head -1
          if ! install --version | grep -q GNU; then
            echo "警告：install 仍非 GNU 版，直接替换 /usr/bin/install"
            sudo ln -sf /usr/bin/gnuinstall /usr/bin/install
            install --version | head -1
          fi

      - name: 缓存 OpenWrt dl 目录
        uses: actions/cache@v4
        with:
          path: openwrt/dl
          key: lo-dl-${{ env.OPENWRT_VERSION }}-${{ hashFiles('build/config.seed') }}
          restore-keys: |
            lo-dl-${{ env.OPENWRT_VERSION }}-

      - name: 克隆 OpenWrt ${{ env.OPENWRT_VERSION }}
        run: |
          git clone --depth 1 -b "$OPENWRT_VERSION" \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git log -1 --oneline

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入 accel-ppp 与 overlay
        run: |
          rm -rf openwrt/package/accel-ppp openwrt/files
          cp -a build/package/accel-ppp openwrt/package/accel-ppp
          cp -a overlay openwrt/files
          chmod 755 openwrt/files/usr/lib/longos/lo.sh \
                    openwrt/files/usr/lib/longos/monitor.sh \
                    openwrt/files/usr/sbin/longos \
                    openwrt/files/etc/init.d/longos \
                    openwrt/files/etc/init.d/trea \
                    openwrt/files/etc/uci-defaults/90-longos \
                    openwrt/files/etc/accel-ppp/ip-up.sh \
                    openwrt/files/etc/accel-ppp/ip-down.sh
          find openwrt/files -maxdepth 4 -type f | sort

      - name: 生成 .config
        run: |
          cp build/config.seed openwrt/.config
          cd openwrt
          make defconfig
          if ! grep -q '^CONFIG_PACKAGE_accel-ppp=y' .config; then
            echo "错误：accel-ppp 未被选入固件"
            exit 1
          fi
          echo "==> 关键包检查"
          grep -E '^CONFIG_PACKAGE_(accel-ppp|mwan3|sqm-scripts|luci)=y' .config || true

      - name: 下载源码包
        run: |
          cd openwrt
          make download -j"$JOBS" || make download -j1 V=s

      - name: 编译固件
        run: |
          cd openwrt
          make -j"$JOBS" || make -j1 V=s

      - name: 检查产物
        run: |
          ls -lh openwrt/bin/targets/x86/64/
          test -n "$(ls openwrt/bin/targets/x86/64/*combined*.img.gz 2>/dev/null)" \
            || { echo "错误：未生成 combined 镜像"; exit 1; }
          echo "==> accel-ppp 软件包"
          ls -lh openwrt/bin/packages/x86_64/base/accel-ppp*.ipk 2>/dev/null || true

      - name: 打包 ISO（BIOS/SeaBIOS）
        run: |
          # memdisk 走传统 BIOS 引导，优先使用非 EFI 的 squashfs combined 镜像（MBR 引导）
          IMG_GZ="$(ls openwrt/bin/targets/x86/64/*squashfs-combined.img.gz 2>/dev/null | head -1)"
          if [ -z "$IMG_GZ" ]; then
            IMG_GZ="$(ls openwrt/bin/targets/x86/64/*combined*.img.gz | head -1)"
          fi
          echo "输入镜像: $IMG_GZ"
          bash build/build-iso.sh "$IMG_GZ"
          # build-iso.sh 直接在输入镜像同目录生成 ISO，无需再次复制（同文件 cp 会报错退出）
          ISO="${IMG_GZ%.img.gz}.iso"
          [ -s "$ISO" ] || { echo "错误：ISO 未生成: $ISO"; exit 1; }
          ls -lh "$ISO"

      - name: 生成 SHA256
        run: |
          cd openwrt/bin/targets/x86/64
          sha256sum *combined*.img.gz *combined*.iso > SHA256SUMS
          cat SHA256SUMS

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: longos-${{ env.OPENWRT_VERSION }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            openwrt/bin/targets/x86/64/*combined*.img.gz
            openwrt/bin/targets/x86/64/*combined*.iso
            openwrt/bin/targets/x86/64/SHA256SUMS

      - name: 写入构建摘要
        if: always()
        run: |
          {
            echo "## LongOS 构建结果"
            echo ""
            echo "- OpenWrt: \`$OPENWRT_VERSION\`"
            echo "- 并行度: \`$JOBS\`"
            echo ""
            echo '```'
            ls -lh openwrt/bin/targets/x86/64/ 2>/dev/null || echo "无产物"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 发布 Release（tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            openwrt/bin/targets/x86/64/*combined*.img.gz
            openwrt/bin/targets/x86/64/*combined*.iso
            openwrt/bin/targets/x86/64/SHA256SUMS
          body: |
            LongOS 固件，基于 OpenWrt ${{ env.OPENWRT_VERSION }}（x86_64 / Generic）。

            导入 PVE：

            ```bash
            gzip -d openwrt-x86-64-generic-squashfs-combined.img.gz
            qm importdisk <vmid> openwrt-x86-64-generic-squashfs-combined.img local-lvm
            ```

            默认面板地址 http://192.168.100.1 ，默认密码 admin。
