# LongOS 高并发调优（PCDN / 20 万级 NAT 会话 / 1Gbps）
# 由 /etc/init.d/longos-tuning 在防火墙加载后逐条写入，避免模块未加载时写入失败
# 说明：数值按 4GB 内存节点设定；2GB 内存节点可把 nf_conntrack_max 降到 262144

# ---- 连接跟踪容量 ----
# 20 万并发建议上限留 2~2.5 倍余量，避免瞬时峰值撞顶丢新连接
net.netfilter.nf_conntrack_max = 524288
# 哈希桶取上限的 1/4，降低链表长度与查找开销
net.netfilter.nf_conntrack_buckets = 131072

# ---- 连接跟踪超时 ----
# 默认 established 5 天，20 万并发下会话表只增不减，必须缩短
net.netfilter.nf_conntrack_tcp_timeout_established = 3600
net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_close_wait = 15
net.netfilter.nf_conntrack_tcp_timeout_fin_wait = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_sent = 30
net.netfilter.nf_conntrack_tcp_timeout_syn_recv = 30
net.netfilter.nf_conntrack_udp_timeout = 30
net.netfilter.nf_conntrack_udp_timeout_stream = 60
net.netfilter.nf_conntrack_icmp_timeout = 10
net.netfilter.nf_conntrack_generic_timeout = 120
# 允许非对称路由下的半开连接（多 WAN 必备）
net.netfilter.nf_conntrack_tcp_loose = 1

# ---- 协议栈队列与端口 ----
net.core.somaxconn = 65535
net.core.netdev_max_backlog = 65536
net.ipv4.tcp_max_syn_backlog = 32768
net.ipv4.tcp_syncookies = 1
# 端口范围放大，20 万会话端口回收更从容
net.ipv4.ip_local_port_range = 10240 65535
# PCDN 高频短连接：快速回收 TIME_WAIT、缩短 FIN 等待
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1
net.ipv4.tcp_fastopen = 3

# ---- 收发缓冲 ----
net.core.rmem_max = 33554432
net.core.wmem_max = 33554432
net.ipv4.tcp_rmem = 4096 87380 33554432
net.ipv4.tcp_wmem = 4096 65536 33554432

# ---- 多 WAN 与邻居表 ----
# mwan3 多线路按 L4 哈希分流，避免同一连接跨线路漂移
net.ipv4.fib_multipath_hash_policy = 1
# PCDN 对端 IP 数量多，扩大 ARP/ND 邻居表阈值，避免邻居表溢出
net.ipv4.neigh.default.gc_thresh1 = 512
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096

# ---- 内存 ----
vm.swappiness = 10
vm.min_free_kbytes = 16384

# ---- 可选（默认关闭，按需启用）----
# 多 WAN 非对称路由场景可放开严格反向路径校验
#net.ipv4.conf.all.rp_filter = 2
#net.ipv4.conf.default.rp_filter = 2
# 需要先安装 kmod-tcp-bbr，否则写入失败（会被安全忽略）
#net.ipv4.tcp_congestion_control = bbr
# 关闭 FTP/SIP 等 ALG helper，可减少攻击面与开销；会失去对应 ALG 功能
#net.netfilter.nf_conntrack_helper = 0
